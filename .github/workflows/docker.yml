name: Container
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: mirth_disposable_container
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://synthetic:synthetic-ci-only@127.0.0.1:5432/mirth_disposable_container
      PG_SSL: 'false'
      JWT_SECRET: synthetic-ci-only-signing-key-at-least-32-characters
      CONFIG_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HL7_ENABLED: 'false'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build locally; publishing requires release approval
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mirth:test
      - name: Runtime image identity and executable check
        run: docker run --rm --entrypoint sh mirth:test -c 'test "$(id -u)" != 0 && node --version && test -f server/dist/server.js'
      - name: Disposable container migration, startup and readiness
        run: |
          runtime_env=(-e NODE_ENV -e DATABASE_URL -e PG_SSL -e JWT_SECRET -e CONFIG_ENCRYPTION_KEY -e HL7_ENABLED -e LOG_LEVEL)
          docker run --rm --network host "${runtime_env[@]}" --entrypoint node mirth:test server/dist/scripts/migrate.js
          docker run --rm --network host "${runtime_env[@]}" --entrypoint node mirth:test server/dist/scripts/migrate.js
          docker run -d --name mirth-smoke --network host --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "${runtime_env[@]}" mirth:test
          trap 'docker rm -f mirth-smoke >/dev/null 2>&1 || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail http://127.0.0.1:9000/health
          curl --fail http://127.0.0.1:9000/ready
          docker stop --time 40 mirth-smoke
