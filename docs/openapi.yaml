                "type": "array",
                "items": {
                  "type": "object"
                }
              }
            },
            "additionalProperties": true
          },
          "code": {
            "const": "MESSAGE_PROCESSING_FAILED"
          },
          "message": {
            "const": "Message processing did not complete successfully."
          },
          "requestId": {
            "type": "string",
            "description": "Server request ID matching X-Request-Id."
          },
          "details": {
            "type": "array",
            "maxItems": 0,
            "items": {}
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "success": {
                  "const": false
                }
              },
              "required": [
                "success"
              ]
            },
            "then": {
              "required": [
                "code",
                "message",
                "requestId",
                "details"
              ]
            }
          }
        ]
