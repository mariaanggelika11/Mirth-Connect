          },
          "409": {
            "description": "CHANNEL_RUNNING or CHANNEL_HAS_PENDING_WORK; stop and reconcile pending work first"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [
          {
            "name": "id",
