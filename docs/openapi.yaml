          }
        }
      },
      "Channel": {
        "type": "object",
        "properties": {
          "validationProfile": {
            "default": {},
            "type": "object",
            "properties": {
              "jsonSchema": {
                "type": "object",
                "propertyNames": {
                  "type": "string"
                },
                "additionalProperties": {}
              },
              "xml": {
                "type": "object",
                "properties": {
                  "root": {
                    "type": "string",
                    "maxLength": 100,
                    "pattern": "^[A-Za-z_][\\w:-]*$"
                  },
                  "requiredPaths": {
                    "maxItems": 50,
                    "type": "array",
                    "items": {
                      "type": "string",
                      "maxLength": 300,
                      "pattern": "^[A-Za-z_][\\w:-]*(?:\\.[A-Za-z_][\\w:-]*){0,15}$"
                    }
                  },
                  "values": {
                    "maxItems": 50,
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "path": {
                          "type": "string",
                          "maxLength": 300,
                          "pattern": "^[A-Za-z_][\\w:-]*(?:\\.[A-Za-z_][\\w:-]*){0,15}$"
                        },
                        "allowed": {
                          "minItems": 1,
                          "maxItems": 50,
                          "type": "array",
                          "items": {
                            "type": "string",
                            "maxLength": 300
                          }
                        }
                      },
                      "required": [
                        "path",
                        "allowed"
                      ],
                      "additionalProperties": false
                    }
                  }
                },
                "additionalProperties": false
              },
              "hl7": {
                "type": "object",
                "properties": {
                  "messageTypes": {
                    "maxItems": 50,
                    "type": "array",
                    "items": {
                      "type": "string",
                      "maxLength": 50
                    }
                  },
                  "versions": {
                    "maxItems": 20,
                    "type": "array",
                    "items": {
                      "type": "string",
                      "maxLength": 20
                    }
                  },
                  "requiredFields": {
                    "maxItems": 50,
                    "type": "array",
                    "items": {
                      "type": "string",
                      "pattern": "^[A-Z0-9]{3}\\.[1-9][0-9]{0,2}$"
                    }
                  }
                },
                "additionalProperties": false
              },
              "script": {
                "type": "string",
                "maxLength": 65536
              },
              "basicSyntax": {
                "type": "boolean",
                "description": "Enable format-appropriate basic syntax validation. HTTP and preview clients parse JSON once before the pipeline; valid JSON string scalars remain strings. XML and HL7 syntax/security checks apply even without additional profile rules. Mapping required/default checks run during transformation after source filtering."
              }
            },
            "additionalProperties": false
          },
          "idempotencyMode": {
            "default": "OPTIONAL",
            "type": "string",
            "enum": [
              "OPTIONAL",
              "REQUIRED",
              "DISABLED"
            ]
          },
          "changeSummary": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 150
          },
          "source": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "HTTP",
                  "HL7"
                ]
              },
              "inboundDataType": {
                "default": "HL7V2",
                "type": "string",
                "enum": [
                  "HL7V2",
                  "JSON",
                  "XML",
                  "TEXT"
                ]
              },
              "endpoint": {
                "type": "string"
              }
            },
            "required": [
              "type",
              "inboundDataType"
            ],
            "additionalProperties": false
          },
          "destinations": {
            "maxItems": 50,
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "deliveryPolicy": {
                  "default": {},
                  "type": "object",
                  "properties": {
                    "failureThreshold": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 100
                    },
                    "openSeconds": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 3600
                    },
                    "maxConcurrency": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 100
                    }
                  },
                  "additionalProperties": false
                },
                "id": {
                  "type": "integer",
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991
                },
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 150
                },
                "type": {
                  "type": "string",
