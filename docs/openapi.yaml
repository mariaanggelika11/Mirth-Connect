            }
          },
          "401": {
            "description": "Authentication invalid or expired"
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [
          {
            "name": "raw",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "Explicit audited administrator raw preview; otherwise every input/source/final payload is masked. Use synthetic messages only."
          }
        ],
        "x-required-permission": "channel:write",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "configuration",
                  "payload"
                ],
                "properties": {
                  "configuration": {
                    "$ref": "#/components/schemas/TransformationPreviewConfiguration"
                  },
                  "payload": {},
                  "raw": {
                    "type": "boolean",
                    "default": false,
                    "description": "Explicit administrator-only audited raw preview; equivalent to raw=true query parameter."
                  }
                }
              }
            }
          }
        },
        "description": "The channel wizard calls this from Review & Test after Source, Transformation and Destinations are complete. Runs the same isolated source and destination filter/transform/template/conversion pipeline as dry-run. For API compatibility, empty destination names and endpoints remain permitted. DNS, sockets, host allowlist and delivery are not tested. Channel save/full dry-run still requires valid connection settings. Synthetic payloads only; normal redaction and audited administrator raw access apply. Invalid configuration identifies the affected setting; failed stages include safe code/message metadata. Versioned source field validation uses the same evaluator in runtime and dry-run. FIELD_VALIDATION_FAILED returns safe per-field diagnostics; invalid payloads create no outbound delivery or retry. Preview source.validationResults contains all active field outcomes and redaction remains enforced. A bounded blank optional changeSummary is treated as absent for compatibility with older wizard clients; other schema limits and save/revision validation remain unchanged."
      }
