    "/api/auth/browser/login": {
      "post": {
        "summary": "Short access token and HttpOnly refresh cookie",
        "operationId": "post__api_auth_browser_login",
        "responses": {
          "200": {
            "description": "Access token and authoritative session deadlines; HttpOnly refresh cookie and readable CSRF cookie are set. Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "token",
                    "session"
                  ],
                  "properties": {
                    "token": {
                      "type": "string",
                      "description": "Short-lived access token; keep in memory only."
                    },
                    "session": {
                      "$ref": "#/components/schemas/BrowserSessionMetadata"
                    },
                    "csrfToken": {
                      "type": "string",
                      "description": "Double-submit CSRF value; not an access token."
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Safe validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "SESSION_INVALID, SESSION_IDLE_EXPIRED or SESSION_ABSOLUTE_EXPIRED. Expired families are revoked; refresh cannot revive them."
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [],
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Credentials"
              }
            }
          }
        },
        "description": "Browser session policy: default access token 300s, idle timeout 900s, absolute maximum 28800s. Login creates a new family; refresh rotates its token without extending either activity or absolute deadlines. Cookie Max-Age is capped to the remaining absolute lifetime. Schema migration 008 is required; legacy sessions require fresh login."
      }
    },
