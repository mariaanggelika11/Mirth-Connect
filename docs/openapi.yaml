                      "OPERATOR",
                      "VIEWER"
                    ]
                  }
                }
              }
            }
          }
        }
      }
    },
    "/api/audit": {
      "get": {
        "summary": "Metadata audit page (50 rows, page bounded)",
        "operationId": "get__api_audit",
        "responses": {
          "200": {
            "description": "Success; see route-specific legacy envelope."
          },
          "400": {
            "description": "Safe validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication invalid or expired"
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [],
        "x-required-permission": "audit:read"
      }
    },
    "/api/auth/sessions/{sessionId}/revoke": {
      "post": {
        "summary": "Revoke own session family with audit",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Revoked"
          },
          "401": {
            "description": "Bearer required"
          },
          "404": {
            "description": "Family does not belong to caller"
          }
        }
      }
    },
    "/api/alerts": {
      "get": {
        "summary": "ADMIN operational alert inbox, metadata only",
        "x-required-permission": "audit:read",
        "responses": {
          "200": {
            "description": "Persistent active/recovered/acknowledged alert metadata"
          },
          "401": {
            "description": "Bearer required"
          },
          "403": {
            "description": "ADMIN permission required"
          }
        }
      }
    },
    "/api/alerts/{code}/acknowledge": {
      "post": {
        "summary": "Audited acknowledgement of active alert",
        "x-required-permission": "audit:read",
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "enum": [
                "DEAD_LETTER",
                "QUEUE_AGE",
                "CHANNEL_ERROR",
                "DATABASE_UNAVAILABLE"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Acknowledged"
          },
          "403": {
            "description": "Permission required"
          },
          "409": {
            "description": "Alert not active"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "connectorKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      },
      "refreshCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "mirth_refresh"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "success",
          "code",
          "message"
        ],
        "properties": {
          "success": {
            "const": false
          },
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "requestId": {
            "type": "string"
          },
          "details": {
            "type": "array",
            "items": {}
          }
        }
      },
      "Credentials": {
        "type": "object",
        "required": [
          "username",
          "password"
        ],
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 100
          },
          "password": {
            "type": "string",
            "maxLength": 72
          }
        }
      },
      "Publish": {
        "type": "object",
        "required": [
          "expectedActiveRevision",
          "changeSummary"
        ],
        "additionalProperties": false,
        "properties": {
          "expectedActiveRevision": {
            "type": "integer",
            "minimum": 0
          },
          "changeSummary": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          }
        }
      },
      "Channel": {
        "type": "object",
        "required": [
          "name",
          "source",
          "destinations"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 150
          },
          "source": {
            "type": "object",
            "required": [
              "type"
            ],
            "properties": {
              "type": {
                "enum": [
                  "HTTP",
                  "HL7"
                ]
              },
              "inboundDataType": {
                "enum": [
                  "HL7V2",
                  "JSON",
                  "XML",
                  "TEXT"
                ]
              }
            }
          },
          "destinations": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/Destination"
            }
          },
          "processingScript": {
            "type": "string",
            "maxLength": 65536
          },
          "filterScript": {
            "type": "string",
            "maxLength": 65536
          },
          "responseScript": {
            "type": "string",
            "maxLength": 65536
          },
          "idempotencyMode": {
            "enum": [
              "OPTIONAL",
              "REQUIRED",
              "DISABLED"
            ]
          },
          "changeSummary": {
            "type": "string",
            "minLength": 1,
            "maxLength": 500
          },
          "validationProfile": {
            "type": "object"
          }
        }
      },
      "Destination": {
        "type": "object",
        "required": [
          "name",
          "type",
          "endpoint"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 150
          },
          "type": {
            "enum": [
              "REST",
              "HL7",
              "MLLP",
              "TCP",
              "RAW"
            ]
          },
          "endpoint": {
            "type": "string",
            "maxLength": 2048
          },
          "outboundDataType": {
            "enum": [
              "HL7V2",
              "JSON",
              "XML",
              "TEXT"
            ]
          },
          "isEnabled": {
            "type": "boolean"
          },
          "retryEnabled": {
            "type": "boolean"
          },
          "maxRetries": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10
          },
          "retryIntervalSeconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 86400
          },
          "timeoutMs": {
            "type": "integer",
            "minimum": 100,
            "maximum": 120000
          }
        }
      },
      "Registration": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Credentials"
          },
          {
            "type": "object",
            "required": [
              "name"
            ],
            "properties": {
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 150
              },
              "password": {
                "type": "string",
                "minLength": 12,
                "maxLength": 72
              }
            }
          }
        ]
      }
    }
  }
}
