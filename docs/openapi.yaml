          "success": {
            "type": "boolean"
          },
          "messageId": {
            "type": "integer",
            "minimum": 1
          },
          "status": {
            "type": "string",
            "examples": [
              "SUCCESS",
              "FILTERED",
              "QUEUED",
              "PARTIAL",
              "FAILED"
            ]
          },
          "result": {
            "type": "object",
            "properties": {
              "success": {
                "type": "boolean"
              },
              "inboundMessageId": {
                "type": "integer",
                "minimum": 1
