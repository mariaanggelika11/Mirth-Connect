            "enum": [
              "DISABLED",
              "SOURCE_FILTERED",
              "FILTERED",
              "NOT_SENT",
              "NOT_SENT_ERROR"
            ]
          },
          "routed": {
            "type": "boolean",
            "description": "Whether the message was eligible for this destination; omitted when preparation failed."
          },
          "finalPayload": {
            "description": "Converted outbound body only for a routed destination after successful preparation. Subject to existing default redaction and audited administrator raw preview permission."
          },
          "status": {
            "enum": [
              "VALID",
              "ERROR"
            ]
          },
          "stages": {
            "type": "object",
            "required": [
              "filter",
              "transformation",
              "template",
              "conversion"
            ],
            "properties": {
              "filter": {
                "enum": [
                  "NOT_RUN",
                  "BYPASSED",
                  "MATCHED",
                  "NOT_MATCHED",
                  "ERROR"
                ]
              },
              "transformation": {
                "enum": [
                  "SKIPPED",
                  "TRANSFORMED",
                  "PASS_THROUGH",
                  "ERROR"
                ]
              },
              "template": {
                "enum": [
                  "SKIPPED",
                  "APPLIED",
                  "NOT_CONFIGURED",
                  "ERROR"
                ]
              },
              "conversion": {
                "enum": [
                  "SKIPPED",
                  "CONVERTED",
                  "ERROR"
                ]
              }
            }
          },
          "code": {
            "type": "string",
            "description": "Safe failed-stage code."
          },
          "message": {
            "type": "string",
            "description": "Actionable safe guidance without payload values or custom exception text."
          },
          "elapsedMs": {
            "type": "integer",
            "minimum": 0
          },
          "fieldTree": {
            "type": "array",
            "maxItems": 512,
            "items": {
              "$ref": "#/components/schemas/DiscoveredField"
            },
            "description": "Metadata-only tree for successful routed HL7 output, parsed from the actual generated message. No values, including during raw preview; at most 512 nodes and 12 levels."
          }
        }
      },
      "HttpHeaderSlot": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "slot"
        ],
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^[A-Za-z][A-Za-z0-9-]{0,63}$",
            "description": "Custom header name, unique ignoring case. Managed Authorization/Host/Content-Type/Content-Length/framing/cookie/proxy/correlation/idempotency/routing headers are prohibited."
          },
          "slot": {
            "type": "string",
            "pattern": "^[A-Z][A-Z0-9_]{0,39}$",
            "description": "Non-secret environment slot suffix. The value comes only from MIRTH_DESTINATION_<actual-destination-id>_<slot>; no literal credential value is accepted here."
          }
        }
      },
      "HttpSettings": {
        "type": "object",
        "additionalProperties": false,
        "description": "REST sender metadata only, stored in existing deliveryPolicy JSON. Values resolve at delivery from destination-scoped environment variables and are never exported. Duplicated/imported destinations receive new IDs and require their own provisioned secrets. No credential resolution or authentication request occurs in dry-run.",
        "properties": {
          "method": {
            "type": "string",
            "enum": [
              "POST",
              "PUT",
              "PATCH"
            ],
            "default": "POST"
          },
          "contentType": {
            "type": "string",
            "enum": [
              "application/json",
              "application/xml",
              "text/xml",
              "application/hl7-v2",
              "text/plain"
            ],
            "description": "Must match outbound format: JSON application/json; XML application/xml or text/xml; HL7V2 application/hl7-v2 or text/plain; TEXT text/plain. Omission selects the first compatible value."
          },
          "authentication": {
            "type": "string",
            "enum": [
              "NONE",
              "BEARER",
              "BASIC"
            ],
            "default": "NONE",
            "description": "BEARER uses MIRTH_DESTINATION_<id>_BEARER_TOKEN; BASIC uses _BASIC_USERNAME and _BASIC_PASSWORD. Explicit auth overrides legacy URL userinfo; NONE preserves legacy URL Basic compatibility. Secret values are nonempty, at most 4096 characters, and must not contain CR/LF/NUL."
          },
          "headers": {
            "type": "array",
            "maxItems": 10,
            "items": {
              "$ref": "#/components/schemas/HttpHeaderSlot"
            }
          }
        }
      },
      "DiscoveredField": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "label",
          "type",
          "selectable"
        ],
        "description": "Field metadata only. Never contains the sample value. Trees are bounded to 512 nodes and 12 levels; invalid/prototype paths cannot be selected.",
        "properties": {
          "path": {
            "type": "string",
            "description": "Actual dotted parsed-structure path. Selectable paths are at most 256 characters and 12 components; indexed arrays/repeated HL7 segments use zero-based numeric components."
          },
          "label": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "selectable": {
            "type": "boolean"
          },
          "children": {
            "type": "array",
            "maxItems": 512,
            "items": {
              "$ref": "#/components/schemas/DiscoveredField"
            }
          }
        }
      },
      "FieldDiscoveryRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "format",
          "payload"
        ],
        "description": "Synthetic sample only. Existing configured payload byte limits apply. Optional processingScript uses the bounded sandbox; discovery runs no source filter or stored facility validation profile.",
        "properties": {
          "format": {
            "enum": [
              "JSON",
              "XML",
              "HL7V2",
              "TEXT"
            ]
          },
          "payload": {
            "description": "JSON data or encoded JSON text, raw XML/HL7 text, or a text sample. Values never appear in the field-discovery response."
          },
          "processingScript": {
            "type": "string",
            "maxLength": 65536,
            "default": ""
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "format": {
                  "enum": [
                    "XML",
                    "HL7V2"
                  ]
                }
              }
            },
            "then": {
              "properties": {
                "payload": {
                  "type": "string",
                  "minLength": 1
                }
              }
            }
          }
        ]
      },
      "FieldDiscoveryResponse": {
        "type": "object",
        "required": [
          "success",
          "format",
          "fields",
          "processedFields",
          "truncated",
          "warnings",
          "networkDelivery"
        ],
        "properties": {
          "success": {
            "const": true
          },
          "format": {
            "enum": [
              "JSON",
              "XML",
              "HL7V2",
              "TEXT"
            ]
          },
          "fields": {
            "type": "array",
            "maxItems": 512,
            "items": {
              "$ref": "#/components/schemas/DiscoveredField"
            }
          },
          "processedFields": {
            "type": "array",
            "maxItems": 512,
            "items": {
              "$ref": "#/components/schemas/DiscoveredField"
            },
            "description": "Structure after optional source transformation; raw sample values are omitted."
          },
          "truncated": {
            "type": "boolean",
            "description": "Whether either the source or source-processed field tree exceeded the 512-node/12-level discovery limits; warnings cover both."
          },
          "warnings": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "networkDelivery": {
            "const": "NOT_SENT"
          }
        }
      },
      "Hl7Configuration": {
        "type": "object",
        "additionalProperties": false,
        "description": "Curated visual-generation profiles for HL7 v2.5 only. These selected segment/field/date/code checks are not complete HL7 or facility conformance. MSH delimiters/type/processing/version are header-controlled. Omitted time/control ID use a runtime UTC timestamp with +0000/generated ID. See repository profile constraints and hospital UAT requirements.",
        "required": [
          "version",
          "messageType",
          "sendingApplication",
          "sendingFacility",
          "receivingApplication",
          "receivingFacility",
          "processingId",
          "patientClass"
        ],
        "properties": {
          "version": {
            "const": "2.5"
          },
          "messageType": {
            "enum": [
              "ADT^A04",
              "ADT^A01",
              "ORU^R01",
              "ORM^O01"
            ]
          },
          "sendingApplication": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]+$"
          },
          "sendingFacility": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]+$"
          },
          "receivingApplication": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]+$"
          },
          "receivingFacility": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "^(?=.*\\S)[^\\u0000-\\u001F\\u007F]+$"
          },
          "processingId": {
            "enum": [
              "P",
              "T",
              "D"
            ],
            "description": "New preset defaults use T; this is a message-processing field, not deployment authorization."
          },
          "messageDateTime": {
            "type": "string",
            "maxLength": 19,
            "pattern": "^(?:[0-9]{14}(?:[+-](?:(?:0[0-9]|1[0-3])[0-5][0-9]|1400))?)?$",
            "description": "Optional calendar-valid YYYYMMDDHHmmss, with optional +/-HHMM offset of at most 14:00. No offset means sender-local time. Empty/omitted generates UTC with +0000. Partial dates and fractional seconds are not supported by this visual configuration.",
            "example": "20261018220000+0000"
          },
          "messageControlId": {
            "type": "string",
            "maxLength": 100,
            "pattern": "^[^\\u0000-\\u001F\\u007F]*$"
          },
          "assigningAuthority": {
            "type": "string",
            "maxLength": 100,
            "pattern": "^[^\\u0000-\\u001F\\u007F]*$"
          },
          "identifierType": {
            "type": "string",
            "maxLength": 100,
            "pattern": "^[^\\u0000-\\u001F\\u007F]*$"
          },
          "patientClass": {
            "enum": [
              "I",
              "O",
              "E",
              "P",
              "R",
              "B",
              "C",
              "N",
              "U"
            ]
          }
        },
        "externalDocs": {
          "description": "HL7 International message structure family references (informative, not a conformance certificate)",
          "url": "https://hl7.org/fhir/uv/v2mappings/STU1/message_maps.html"
        }
      },
      "FieldMappingRowV2": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "source",
          "target",
          "required"
        ],
        "properties": {
          "source": {
            "type": "string",
            "maxLength": 256,
            "description": "Bounded own-property path with at most 12 components. JSON/XML dotted paths; XML attributes under $. HL7 PID-5.1 aliases normalize to PID.5.1; explicit zero-based indexes address repetitions in the parsed structure."
          },
          "target": {
            "type": "string",
            "maxLength": 256,
            "description": "Nonoverlapping output path. JSON arrays use indexes 0-999. HL7 targets must be supported by the selected curated profile; explicit OBX[0].5-style repeats are supported. Reserved MSH fields use header configuration."
          },
          "required": {
            "type": "boolean"
          },
          "defaultValue": {
            "type": "string",
            "maxLength": 1024,
            "description": "Applied only to missing/null/empty-string source values before required checks and explicit conversion; zero and false remain present."
          },
          "conversion": {
            "enum": [
              "NONE",
              "TEXT",
              "NUMBER",
              "BOOLEAN",
              "DATE_TO_HL7",
              "DATE_FROM_HL7"
            ],
            "description": "Explicit conversion only. DATE_TO_HL7 converts calendar-valid YYYY-MM-DD to YYYYMMDD; DATE_FROM_HL7 reverses it. Invalid conversions fail without delivery."
          }
        }
      },
      "FieldMappingV2": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "rows"
        ],
        "description": "Compiler metadata embedded in the canonical MIRTH_FIELD_MAPPING_V2 processingScript. This is not a separate channel request property or new API endpoint. Existing V1 and advanced scripts remain compatible. Optional hl7 seeds curated message structure before existing serialization; hl7 and rootElement cannot both be used. Altered or noncanonical reserved V2 metadata/body fails closed with FIELD_MAPPING_CONFIG_INVALID before sandbox execution or delivery. Older binaries cannot interpret the V2 result envelope; publish a compatible V1 or custom-script revision before downgrade.",
        "properties": {
          "version": {
            "const": 2
          },
          "rows": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/FieldMappingRowV2"
            }
          },
          "rootElement": {
            "type": "string",
            "maxLength": 80,
            "pattern": "^(?:[A-Za-z_][A-Za-z0-9_.-]{0,79})?$"
          },
          "hl7": {
            "$ref": "#/components/schemas/Hl7Configuration"
          }
        }
      },
      "BrowserSessionMetadata": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "idleTimeoutSeconds",
          "warningSeconds",
          "idleExpiresAt",
          "absoluteExpiresAt",
          "serverTime"
        ],
        "properties": {
          "idleTimeoutSeconds": {
            "type": "integer",
            "minimum": 60,
            "maximum": 28800,
            "default": 900
          },
          "warningSeconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 600,
            "default": 60
          },
          "idleExpiresAt": {
            "type": "string",
            "format": "date-time",
            "description": "Server-authoritative idle deadline, capped at the absolute deadline. Only explicit authenticated browser activity can move it."
          },
          "absoluteExpiresAt": {
            "type": "string",
            "format": "date-time",
            "description": "Fixed deadline since login, at most eight hours. Refresh and activity never extend it."
          },
          "serverTime": {
            "type": "string",
            "format": "date-time",
            "description": "Server timestamp used for the browser countdown."
          }
        }
      },
      "ChannelPreviewConfiguration": {
        "type": "object",
        "properties": {
          "validationProfile": {
            "default": {},
            "oneOf": [
              {
                "$ref": "#/components/schemas/LegacyValidationProfile"
              },
              {
                "$ref": "#/components/schemas/ValidationSettings"
              }
            ]
          },
          "idempotencyMode": {
            "default": "OPTIONAL",
            "type": "string",
            "enum": [
              "OPTIONAL",
              "REQUIRED",
              "DISABLED"
            ]
          },
          "changeSummary": {
            "type": "string",
            "maxLength": 500,
            "description": "Optional for testing. Empty/whitespace-only values up to 500 characters are treated as absent; save/revision endpoints retain their own summary requirements."
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 150
          },
          "source": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "HTTP",
                  "HL7"
                ]
              },
              "inboundDataType": {
                "default": "HL7V2",
                "type": "string",
                "enum": [
                  "HL7V2",
                  "JSON",
                  "XML",
                  "TEXT"
                ]
              },
              "endpoint": {
                "type": "string"
              }
            },
            "required": [
              "type",
              "inboundDataType"
            ],
            "additionalProperties": false
          },
          "destinations": {
            "maxItems": 50,
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "deliveryPolicy": {
                  "default": {},
                  "type": "object",
                  "properties": {
                    "failureThreshold": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 100
                    },
                    "openSeconds": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 3600
                    },
                    "maxConcurrency": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 100
                    },
                    "http": {
                      "$ref": "#/components/schemas/HttpSettings"
                    }
                  },
                  "additionalProperties": false
                },
                "id": {
                  "type": "integer",
                  "exclusiveMinimum": 0,
                  "maximum": 9007199254740991
                },
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 150
                },
                "type": {
                  "type": "string",
                  "enum": [
                    "REST",
                    "HL7",
                    "MLLP",
                    "TCP",
                    "RAW"
                  ]
                },
                "endpoint": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 2048
                },
                "outboundDataType": {
                  "default": "HL7V2",
                  "type": "string",
                  "enum": [
                    "HL7V2",
                    "JSON",
                    "XML",
                    "TEXT"
                  ]
                },
                "processingScript": {
                  "default": "",
                  "type": "string",
                  "maxLength": 65536,
                  "description": "Optional per-destination transformer in the existing bounded sandbox. Runs on an independent clone after the destination filter and before templateScript/outbound conversion. Canonical visual mappings and retained advanced scripts use this field; one destination cannot mutate another destination input. Canonical MIRTH_FIELD_MAPPING_V2 adds explicit type/date conversions, indexed arrays and optional curated HL7 v2.5 configuration. This remains the existing bounded sandbox script field; see FieldMappingV2 compiler metadata."
                },
                "responseScript": {
                  "default": "",
                  "type": "string",
                  "maxLength": 65536
                },
                "templateScript": {
                  "default": "",
                  "type": "string",
                  "maxLength": 65536,
                  "description": "Optional retained sandbox script executed after processingScript and before outbound conversion. Receives its result as msg and can replace the final request body. This is not a template catalog or picker; legacy configuration is preserved. Failure prevents delivery and automatic retry for this unprepared message."
                },
                "filterScript": {
                  "default": "",
                  "type": "string",
                  "maxLength": 65536,
                  "description": "Optional sandboxed Boolean condition evaluated on a clone of the source-processed message before this destination transformer. The enabled destination receives all eligible messages when filterScript is empty or a canonical MIRTH_DESTINATION_FILTER_DISABLED_V1 retained-rule wrapper is present; the inactive rule remains stored and is not executed. Destination isEnabled remains independent. Simple conditions use canonical MIRTH_SIMPLE_CONDITION_V1 metadata and bounded own-property dotted paths, including numeric array indexes; prototype paths are denied. Operators: eq, neq, contains, startsWith, exists, notExists, gt, gte, lt, lte, isEmpty, isNotEmpty. Text comparisons use scalar string representations; numeric comparisons require finite values. isEmpty matches missing/null/empty text; isNotEmpty accepts present non-null nonempty scalar values, including zero/false. Missing/non-scalar values do not satisfy comparisons including neq. The simplified UI requires complete field/value settings for new active conditions. Existing canonical empty comparisons and legacy scripts, including literal false, retain their behavior. Corrupted reserved metadata is rejected. A mismatch creates FILTERED without a network attempt or retry. No new database field is added."
                },
                "isEnabled": {
                  "default": true,
                  "type": "boolean",
                  "description": "False excludes this destination from runtime jobs, filter evaluation, transformation, templates and delivery. Its stored settings remain retained. Independent of whether its conditional filter is enabled."
                },
                "retryEnabled": {
                  "default": false,
                  "type": "boolean",
                  "description": "Apply configured bounded retry only after a final payload has been prepared. Filter mismatches, preparation failures and disabled destinations never create automatic retries. Permanent HTTP 4xx except 408/429 stop automatic retry; 408/429 and 5xx use the configured policy. Uncertain transport outcomes are quarantined."
                },
                "maxRetries": {
                  "default": 3,
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 10
                },
                "retryIntervalSeconds": {
                  "default": 30,
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 86400
                },
                "timeoutMs": {
                  "default": 10000,
                  "type": "integer",
                  "minimum": 100,
                  "maximum": 120000
                }
              },
              "required": [
                "deliveryPolicy",
                "name",
                "type",
                "endpoint",
                "outboundDataType",
                "processingScript",
                "responseScript",
                "templateScript",
                "filterScript",
                "isEnabled",
                "retryEnabled",
                "maxRetries",
                "retryIntervalSeconds",
                "timeoutMs"
              ],
              "additionalProperties": false
            }
          },
          "processingScript": {
            "default": "",
            "type": "string",
            "maxLength": 65536,
            "description": "Common source transformation script, including canonical V1/V2 visual mappings. V2 supports explicit conversions and indexed paths. Destination output format and optional curated HL7 generation belong to the per-destination transformation; no separate source-format selector is added here."
          },
          "responseScript": {
            "default": "",
            "type": "string",
            "maxLength": 65536
          },
          "filterScript": {
            "default": "",
            "type": "string",
            "maxLength": 65536,
            "description": "Optional sandboxed boolean filter. Simple Field/Operator/Value conditions compile into an intact canonical MIRTH_SIMPLE_CONDITION_V1 script stored in this existing field. Supported operators: eq, neq, contains, startsWith, exists, notExists, gt, gte, lt, lte. Text operators compare string representations of scalar values; numeric operators accept only finite numbers/nonempty numeric strings. Missing/non-scalar values do not satisfy comparisons, including neq. Presence operators test own-property path existence, including existing null/empty values. Unrecognized/custom/legacy scripts are preserved; no separate condition API or database field."
          }
        },
        "required": [
          "validationProfile",
          "idempotencyMode",
          "name",
          "source",
          "destinations",
          "processingScript",
          "responseScript",
          "filterScript"
        ],
        "additionalProperties": false,
        "description": "Full configuration dry-run: same validation as Channel, except a bounded blank optional changeSummary is treated as absent. This does not save a revision."
      }
    }
  }
}
