        "additionalProperties": false
      },
      "ValidationFieldRule": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "type",
          "required"
        ],
        "properties": {
          "field": {
            "type": "string",
            "minLength": 1,
            "maxLength": 256,
            "description": "Own-property dot path, maximum 12 parts; zero-based numeric array indexes. Prototype keys forbidden."
          },
          "type": {
            "enum": [
              "text",
              "number",
              "boolean",
              "date"
            ]
          },
          "required": {
            "type": "boolean",
            "description": "Reject absent/null/empty/whitespace strings; 0 and false are values."
          },
          "allowedValues": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": {
              "type": "string",
              "maxLength": 300,
              "minLength": 1,
              "pattern": "^[^\\r\\n]+$"
            },
            "description": "Text rules only; exact case-sensitive matching."
          },
          "minLength": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1048576
          },
          "maxLength": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1048576
          },
          "minimum": {
            "type": "number"
          },
          "maximum": {
            "type": "number"
          }
        }
      },
      "ValidationSettings": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "version",
          "mode",
          "fieldRules",
          "custom"
        ],
        "properties": {
          "version": {
            "const": 1
          },
          "mode": {
            "enum": [
              "NONE",
              "FIELDS",
              "CUSTOM",
              "LEGACY"
            ]
          },
          "fieldRules": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "$ref": "#/components/schemas/ValidationFieldRuleDraft"
            },
            "description": "Retained while inactive. Active FIELDS requires 1-50 complete unique ValidationFieldRule objects and JSON source."
          },
          "custom": {
            "type": "object",
            "additionalProperties": true,
            "description": "Retained inactive profile; active CUSTOM uses known legacy profile keys and must match input format. JSON editor wraps bare schema in jsonSchema."
          },
          "legacy": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "description": "Only active mode evaluates. Unknown active profile keys are rejected; no silent schema stripping. A saved empty JSON Schema is valid and adds no field restrictions.",
        "allOf": [
          {
            "if": {
              "properties": {
                "mode": {
                  "const": "FIELDS"
                }
              },
              "required": [
                "mode"
              ]
            },
            "then": {
              "properties": {
                "fieldRules": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 50,
                  "items": {
                    "$ref": "#/components/schemas/ValidationFieldRule"
                  }
                }
              }
            }
          }
        ]
      },
      "ValidationRuleResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "type",
          "required",
          "status",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string",
            "maxLength": 256
          },
          "type": {
            "enum": [
              "text",
              "number",
              "boolean",
              "date"
            ]
          },
          "required": {
            "type": "boolean"
          },
          "status": {
            "enum": [
              "PASSED",
              "FAILED",
              "SKIPPED"
            ]
          },
          "code": {
            "enum": [
              "REQUIRED",
              "TYPE",
              "DATE",
              "ALLOWED_VALUES",
              "MIN_LENGTH",
              "MAX_LENGTH",
              "MINIMUM",
              "MAXIMUM"
            ]
          },
          "message": {
            "type": "string",
            "description": "Safe fixed reason; no payload value, allowed-list values or exception text."
          }
        }
      },
      "ValidationFieldRuleDraft": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "type",
          "required"
        ],
        "properties": {
          "field": {
            "type": "string",
            "maxLength": 256,
            "description": "Own-property dot path, maximum 12 parts; zero-based numeric array indexes. Prototype keys forbidden."
          },
          "type": {
            "enum": [
              "text",
              "number",
              "boolean",
              "date"
            ]
          },
          "required": {
            "type": "boolean",
            "description": "Reject absent/null/empty/whitespace strings; 0 and false are values."
          },
          "allowedValues": {
            "type": "array",
            "maxItems": 50,
            "items": {
              "type": "string",
              "maxLength": 300,
              "pattern": "^[^\\r\\n]*$"
            },
            "description": "Text rules only; exact case-sensitive matching."
          },
          "minLength": {
            "type": "number"
          },
          "maxLength": {
            "type": "number"
          },
          "minimum": {
            "type": "number"
          },
          "maximum": {
            "type": "number"
          }
        },
        "description": "Bounded structurally safe inactive field settings; incomplete paths and semantic limits may be retained, but must satisfy active ValidationFieldRule rules before FIELDS can run."
      }
    }
  }
}
