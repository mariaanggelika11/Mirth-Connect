    "title": "Mini Mirth Connect",
    "version": "2.0.0-draft",
    "description": "Static documentation of implemented routes. Synthetic examples only. No production readiness claim. Existing success envelopes vary by endpoint. Follow-up: schema version 6 delivery HTTP metadata and operational controls; draft patches omit private configuration. JSON idempotency uses canonical hashes with legacy digest compatibility; IDEMPOTENCY_RETENTION_HOURS=0 retains prior behavior. Expired HTTP reservations only release after active/failed delivery guards; message evidence is retained. XML supports bounded literal path rules, not full XSD."
  },
