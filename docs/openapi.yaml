        "description": "Requires channel:delete (ADMIN), STOPPED and no IN-PROCESS/PROCESSING/QUEUED/RETRYING messages or unexpired message lease. Persists ARCHIVED using the existing status column. Archived channels cannot be started, edited or published; inspect history with includeArchived=true. No data is deleted."
      }
