    "/api/auth/browser/activity": {
      "post": {
        "summary": "Renew idle deadline after explicit browser user activity",
        "operationId": "post__api_auth_browser_activity",
        "description": "Requires a valid browser JWT, current refresh cookie from the same family and CSRF. Uses server time only. An expired/revoked family cannot be renewed. Automatic polling, role checks and refresh do not invoke this action; the UI throttles trusted pointer/keyboard activity. This is an authenticated activity signal, not cryptographic proof of physical presence. Absolute expiry never changes.",
        "security": [
          {
            "bearerAuth": [],
            "refreshCookie": []
          }
        ],
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Matching double-submit CSRF value from the mirth_csrf cookie; same family as the browser JWT and current refresh token."
          }
        ],
        "responses": {
          "200": {
            "description": "Idle deadline renewed within the absolute limit; Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success",
                    "session"
                  ],
                  "properties": {
                    "success": {
                      "const": true
                    },
                    "session": {
                      "$ref": "#/components/schemas/BrowserSessionMetadata"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Missing/invalid browser identity, mismatched family or expired/revoked session. No revival."
          },
          "403": {
            "description": "CSRF/origin rejected."
          },
          "429": {
            "description": "Authentication rate limit; no deadline extension."
          },
          "503": {
            "description": "Database unavailable; session not extended."
          }
        }
      }
    }
