    "/api/channel/preview-transformation": {
      "post": {
        "summary": "Preview transformation before configuring a destination; no network or connection validation",
        "operationId": "post__api_channel_preview_transformation",
        "responses": {
          "200": {
            "description": "Structured source validation/filter/transformation and per-destination stages/finalPayload/outputFormat; input and source payloads are separately identified. networkDelivery is always NOT_SENT. success=false when a destination stage fails; errors contain safe codes only. Source validation/filter/transformation failures identify source.code and the ERROR stage, with no destination processing. Connection settings are deliberately not validated; warnings explicitly state this. No application request, DNS lookup or connection probe is made.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success",
                    "accepted",
                    "input",
                    "source",
                    "networkDelivery",
                    "results",
                    "rawPayload"
                  ],
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "accepted": {
                      "type": "boolean"
                    },
                    "networkDelivery": {
                      "const": "NOT_SENT"
                    },
                    "rawPayload": {
                      "type": "boolean"
                    },
                    "input": {
                      "type": "object",
                      "properties": {
                        "format": {
                          "type": "string"
                        },
                        "payload": {}
                      }
                    },
                    "source": {
                      "type": "object",
                      "properties": {
                        "format": {
                          "type": "string"
                        },
                        "payload": {},
                        "validation": {
                          "enum": [
                            "PASSED",
                            "ERROR",
                            "SKIPPED"
                          ]
                        },
                        "filter": {
                          "enum": [
                            "ACCEPTED",
                            "FILTERED",
                            "ERROR",
                            "SKIPPED"
                          ]
                        },
                        "transformation": {
                          "enum": [
                            "TRANSFORMED",
                            "PASS_THROUGH",
                            "SKIPPED",
                            "ERROR"
                          ]
                        },
                        "code": {
                          "type": "string",
                          "description": "Safe diagnostic code for a failed source stage; no exception text."
                        }
                      }
                    },
                    "results": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "outputFormat": {
                            "type": "string"
                          },
                          "connectorType": {
                            "type": "string"
                          },
                          "finalPayload": {},
                          "status": {
                            "enum": [
                              "VALID",
                              "ERROR"
                            ]
                          },
                          "stages": {
                            "type": "object"
                          },
                          "code": {
                            "type": "string"
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Safe validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication invalid or expired"
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [
          {
            "name": "raw",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "Explicit audited administrator raw preview; otherwise every input/source/final payload is masked. Use synthetic messages only."
          }
        ],
        "x-required-permission": "channel:write",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "configuration",
                  "payload"
                ],
                "properties": {
                  "configuration": {
                    "$ref": "#/components/schemas/TransformationPreviewConfiguration"
                  },
                  "payload": {},
                  "raw": {
                    "type": "boolean",
                    "default": false,
                    "description": "Explicit administrator-only audited raw preview; equivalent to raw=true query parameter."
                  }
                }
              }
            }
          }
        },
        "description": "Runs the same isolated source and destination filter/transform/template/conversion pipeline as dry-run. Empty destination names and endpoints are permitted only for this preview. DNS, sockets, host allowlist and delivery are not tested. The normal channel save/dry-run endpoint still requires valid connection settings. Synthetic payloads only; normal redaction and audited administrator raw access apply."
      }
    }
  },
  "components": {
    "securitySchemes": {
