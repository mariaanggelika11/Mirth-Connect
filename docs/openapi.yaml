    "/api/auth/me": {
      "get": {
        "summary": "Current database-backed role and account",
        "operationId": "get__api_auth_me",
        "responses": {
          "200": {
            "description": "Current user plus optional browser session deadlines. Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success",
                    "data"
                  ],
                  "properties": {
                    "success": {
                      "const": true
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "integer"
                        },
                        "name": {
                          "type": "string"
                        },
                        "role": {
                          "type": "string",
                          "enum": [
                            "ADMIN",
                            "DEVELOPER",
                            "OPERATOR",
                            "VIEWER"
                          ]
                        }
                      }
                    },
                    "session": {
                      "$ref": "#/components/schemas/BrowserSessionMetadata"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Safe validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication invalid or expired"
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [],
        "description": "Current database role and user. Browser JWT requests enforce family idle/absolute/revocation on every call and return top-level session metadata. Reading this route does not count as user activity. Bearer automation retains its existing expiry and has no browser session metadata."
      }
    },
