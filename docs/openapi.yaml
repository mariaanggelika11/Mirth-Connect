        "type": "object",
        "required": [
          "success",
          "messageId",
          "status",
          "result"
        ],
        "description": "Standard HTTP envelope with additive messageId/status aliases. The complete legacy result and any result.response generated by a legacy source response script remain available. SUCCESS denotes all configured deliveries accepted by their transports; it does not prove downstream business processing. FILTERED denotes a valid message excluded by source selection. Failed persisted outcomes also include the standard safe code/message/requestId/details fields while retaining the complete legacy result.",
