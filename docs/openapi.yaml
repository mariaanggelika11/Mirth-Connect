    "/api/channel/preview-transformation": {
      "post": {
        "summary": "Preview source mapping and each destination output without network delivery",
        "operationId": "post__api_channel_preview_transformation",
        "responses": {
          "200": {
            "description": "Structured source validation/filter/transformation and per-destination stages/finalPayload/outputFormat; input and source payloads are separately identified. networkDelivery is always NOT_SENT. success=false when a destination stage fails; errors contain safe codes and actionable configuration guidance without payload values or exception text. Source validation/filter/transformation failures identify source.code and the ERROR stage, with no destination processing. Connection settings are deliberately not validated; warnings explicitly state this. No application request, DNS lookup or connection probe is made.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success",
                    "accepted",
                    "input",
                    "source",
                    "networkDelivery",
                    "results",
                    "rawPayload"
                  ],
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "accepted": {
                      "type": "boolean"
                    },
                    "networkDelivery": {
                      "const": "NOT_SENT"
                    },
                    "rawPayload": {
                      "type": "boolean"
                    },
                    "input": {
                      "type": "object",
                      "properties": {
                        "format": {
                          "type": "string"
                        },
                        "payload": {}
                      }
                    },
                    "source": {
                      "type": "object",
                      "properties": {
                        "format": {
                          "type": "string"
                        },
                        "payload": {},
                        "validation": {
                          "enum": [
                            "PASSED",
                            "ERROR",
                            "SKIPPED"
                          ]
                        },
                        "filter": {
                          "enum": [
                            "ACCEPTED",
                            "FILTERED",
                            "ERROR",
                            "SKIPPED"
                          ]
                        },
                        "transformation": {
                          "enum": [
                            "TRANSFORMED",
                            "PASS_THROUGH",
                            "SKIPPED",
                            "ERROR"
                          ]
                        },
                        "code": {
                          "type": "string",
                          "description": "Safe diagnostic code for a failed source stage; no exception text."
                        },
                        "message": {
                          "type": "string",
                          "description": "Safe actionable guidance for a failed source stage. Canonical field mappings can identify a required target field; payload values and exception text are never included."
                        }
                      }
                    },
                    "results": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "name": {
                            "type": "string"
                          },
                          "outputFormat": {
                            "type": "string"
                          },
                          "connectorType": {
                            "type": "string"
                          },
                          "finalPayload": {},
                          "status": {
                            "enum": [
                              "VALID",
                              "ERROR"
                            ]
                          },
                          "stages": {
                            "type": "object"
                          },
                          "code": {
                            "type": "string"
                          },
                          "message": {
                            "type": "string",
                            "description": "Safe actionable guidance for a failed destination stage; no payload values or custom exception text."
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Safe validation error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication invalid or expired"
          },
          "403": {
            "description": "Permission/origin/CSRF denied"
          },
          "409": {
            "description": "State, revision or idempotency conflict"
          },
          "429": {
            "description": "Management/authentication rate limit"
          },
          "503": {
            "description": "Database or capacity unavailable"
          }
        },
        "parameters": [
          {
            "name": "raw",
            "in": "query",
            "schema": {
              "type": "boolean",
              "default": false
            },
            "description": "Explicit audited administrator raw preview; otherwise every input/source/final payload is masked. Use synthetic messages only."
          }
        ],
        "x-required-permission": "channel:write",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "configuration",
                  "payload"
                ],
                "properties": {
                  "configuration": {
                    "$ref": "#/components/schemas/TransformationPreviewConfiguration"
                  },
                  "payload": {},
                  "raw": {
                    "type": "boolean",
                    "default": false,
                    "description": "Explicit administrator-only audited raw preview; equivalent to raw=true query parameter."
                  }
                }
              }
            }
          }
        },
        "description": "The channel wizard calls this from Review & Test after Source, Transformation and Destinations are complete. Runs the same isolated source and destination filter/transform/template/conversion pipeline as dry-run. For API compatibility, empty destination names and endpoints remain permitted. DNS, sockets, host allowlist and delivery are not tested. Channel save/full dry-run still requires valid connection settings. Synthetic payloads only; normal redaction and audited administrator raw access apply. Invalid configuration identifies the affected setting; failed stages include safe code/message metadata. Versioned source field validation uses the same evaluator in runtime and dry-run. FIELD_VALIDATION_FAILED returns safe per-field diagnostics; invalid payloads create no outbound delivery or retry. Preview source.validationResults contains all active field outcomes and redaction remains enforced."
      }
    },
