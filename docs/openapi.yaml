      "MessageDestinationLog": {
        "type": "object",
        "description": "Captured destination event. New filtering/preparation outcomes do not create transport attempt logs; retained legacy filtering/preparation events and admission waits are explicitly classified. Format/name/type come from the immutable snapshot when available. Payload fields require message:payload; ordinary metadata does not.",
        "properties": {
          "id": {
            "type": "integer"
          },
          "messageId": {
            "type": "integer"
          },
          "destinationId": {
            "type": "integer"
          },
          "destinationName": {
            "type": "string"
          },
          "outboundFormat": {
            "type": "string"
          },
          "connectorType": {
            "type": "string"
          },
          "snapshotCaptured": {
            "type": "boolean"
          },
          "status": {
            "type": "string"
          },
          "sentAt": {
            "type": "string",
            "format": "date-time",
            "description": "Present only for an event with actual network-attempt evidence. Use occurredAt for non-network events."
          },
          "httpStatus": {
            "type": "integer",
            "minimum": 100,
            "maximum": 599,
            "description": "Actual HTTP status from this attempt. Omitted for legacy attempts, non-HTTP transports, and failures before an HTTP response. The receiving system’s HTTP acceptance does not prove downstream business processing.",
            "examples": [
              201,
              204,
              400,
              503
            ]
          },
          "ackCode": {
            "type": [
              "string",
              "null"
            ],
            "description": "HL7 acknowledgement code; never overloaded with an HTTP response code."
          },
          "canResend": {
            "type": "boolean",
            "description": "State/configuration eligibility hint. The resend endpoint independently verifies prepared final-payload evidence and may reject unavailable or unsafe historical work."
          },
          "requestData": {
            "description": "Destination input; omitted without message:payload."
          },
          "outboundData": {
            "description": "Stored outbound message; omitted without message:payload."
          },
          "responseText": {
            "description": "Delivery response body or safe diagnostic code; omitted without message:payload. Redacted unless administrator raw access is explicitly requested and audited."
          },
          "durationMs": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "description": "Actual duration in milliseconds of this captured transport attempt, excluding database acquisition and result persistence. Null/absent for legacy or unattempted work; never inferred from timestamps."
          },
          "attemptCount": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0,
            "description": "Recorded transport attempts across the complete outbound history, including retries. Known filtering/preparation/admission and pre-network policy rejection events do not count. Zero for a known non-network event with no attempts; null for ambiguous legacy history."
          },
          "eventKind": {
            "enum": [
              "DELIVERY_ATTEMPT",
              "DELIVERY_REJECTION",
              "FILTERED",
              "PREPARATION_FAILURE",
              "ADMISSION_WAIT",
              "UNKNOWN"
            ],
            "description": "Classification from captured transport metadata or known safe diagnostic codes; historical uncertainty is preserved. DELIVERY_REJECTION identifies known local endpoint/configuration/credential denial before a network request; no sentAt or transport duration is claimed."
          },
          "networkAttempted": {
            "type": "boolean",
            "description": "True for recorded network evidence, false for known non-network events, omitted for UNKNOWN."
          },
          "occurredAt": {
            "type": "string",
            "format": "date-time",
            "description": "Saved event timestamp, including non-network events."
          }
        }
      },
