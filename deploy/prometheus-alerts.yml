groups:
  - name: mirth
    rules:
      - alert: MirthDeadLetters
        expr: mirth_dead_letter_open > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Unresolved delivery requires operator reconciliation
      - alert: MirthQueueAge
        expr: mirth_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pending messages exceed initial review threshold
      - alert: MirthUnavailable
        expr: up{job="mirth"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Integration engine scrape unavailable
